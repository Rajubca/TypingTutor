<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Tutor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Typing Tutor</h1>
        <p>Master your keyboard skills with guided practice.</p>

        <div class="menu-card">
            <h2>Configure Practice</h2>
            <form id="setup-form" action="practice.html" method="get">
                <div class="form-group">
                    <label for="mode">Content Type:</label>
                    <select id="mode" name="mode" required>
                        <option value="words">Random Words</option>
                        <option value="sentences">Sentences</option>
                        <option value="code">Programming Code</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="duration">Duration:</label>
                    <select id="duration" name="duration" required>
                        <option value="60">1 Minute</option>
                        <option value="180">3 Minutes</option>
                        <option value="300">5 Minutes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="hands" name="hands" value="true" checked>
                        Show Hand Gestures & Finger Guides
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Start Practice</button>
            </form>
        </div>

        <div class="menu-links">
            <a href="stats.html" class="btn btn-secondary">View Statistics</a>
        </div>
    </div>
</body>
</html>
